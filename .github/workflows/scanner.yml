name: radar-oportunidades

on:
  schedule:
    # L-V tras el cierre de NYSE (verano 20:00 UTC / invierno 21:00 UTC).
    - cron: "17 21 * * 1-5"
    - cron: "19 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Escanear universo
        run: python scanner.py
      - name: Guardar resultados
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A scanner_state.json candidatos.json
          git diff --cached --quiet || git commit -m "radar $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main || true
          git push || true
